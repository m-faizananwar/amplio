<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- The mark on a paper disc so it reads on dark tab bars; a 1px ink ring at
       10% keeps the disc visible on a white one. Heavier strokes for tab size. -->
  <circle cx="16" cy="16" r="16" fill="#FAFAF7"/>
  <circle cx="16" cy="16" r="15.5" fill="none" stroke="#111111" stroke-opacity="0.1" stroke-width="1"/>
  <g transform="translate(4 4)">
    <path d="M3.5 18.5L11.5 15L20.5 5" fill="none" stroke="#111111" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="3.5" cy="18.5" r="2.8" fill="#111111"/>
    <circle cx="11.5" cy="15" r="2.8" fill="#111111"/>
    <circle cx="20.5" cy="5" r="2.8" fill="#111111"/>
  </g>
</svg>
