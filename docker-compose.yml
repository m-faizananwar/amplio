services:
  db:
    image: postgres:16-alpine
    container_name: amplio-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: amplio
    ports:
      - "5432:5432"
    volumes:
      - amplio-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d amplio"]
      interval: 2s
      timeout: 2s
      retries: 15

volumes:
  amplio-db:
